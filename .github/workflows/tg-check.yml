name: tg-check

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить бота (getMe)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -m 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" -o /tmp/me.json
          python3 -c "import json;d=json.load(open('/tmp/me.json'));b=(d.get('result') or {});print('ok =',d.get('ok'));print('id =',b.get('id'));print('username = @'+str(b.get('username')));print('name =',b.get('first_name'))"

      - name: Найти каналы, куда добавлен бот
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/tg_discover.py