name: Deploy backend to Vercel — вручную

# Backend переехал с Modal (мёртвый) на Vercel. Vercel поддерживает FastAPI «из коробки»:
# он сам находит объект `app` в index.py. Запускается вручную из вкладки Actions.
#
# Требуется секрет VERCEL_TOKEN (Settings -> Secrets and variables -> Actions),
# а также SECRET_KEY, CRON_SECRET, GROQ_API_KEY, TELEGRAM_BOT_TOKEN, DATABASE_URL.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Не задан секрет VERCEL_TOKEN (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --env SECRET_KEY="$SECRET_KEY" \
            --env CRON_SECRET="$CRON_SECRET" \
            --env GROQ_API_KEY="$GROQ_API_KEY" \
            --env GROQ_MODEL="openai/gpt-oss-120b" \
            --env TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env RESEND_API_KEY="$RESEND_API_KEY" \
            --env FRONTEND_ORIGIN="https://admin-999.github.io" \
            --env FRONTEND_URL="https://admin-999.github.io/ai-content-business" \
            --env IG_CARDS_DIR="/tmp/ig_cards" \
            --env MP_PHOTOS_DIR="/tmp/mp_photos" \
            --env OZON_CACHE="/tmp/ozon_categories.json"
          echo "---"
          echo "Скопируйте URL выше в frontend/js/config.js (API_URL)"
