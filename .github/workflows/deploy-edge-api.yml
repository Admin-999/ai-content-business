name: Deploy backend (Supabase Edge Function)

# Разворачивает Edge Function "api" (в том числе админ-маршруты /api/admin/*)
# в Supabase через Management API.
#
# Нужен один секрет репозитория:
#   SUPABASE_ACCESS_TOKEN — токен управления Supabase
#   (Supabase → Account → Access Tokens: https://supabase.com/dashboard/account/tokens)
# Он НЕ равен anon/service_role ключам проекта.
#
# Запуск: Actions → "Deploy backend (Supabase Edge Function)" → Run workflow.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy function "api"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: yapnxwamxmyobnffdhvu
          SLUG: api
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Не задан секрет SUPABASE_ACCESS_TOKEN. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p /tmp/fn
          cp "supabase/functions/$SLUG/index.ts" /tmp/fn/index.ts
          printf '{"entrypoint_path":"index.ts","verify_jwt":false,"name":"%s"}' "$SLUG" > /tmp/fn/metadata.json
          code=$(curl -s -m 180 -o /tmp/fn/out.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/deploy?slug=$SLUG" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -F "metadata=@/tmp/fn/metadata.json;type=application/json" \
            -F "file=@/tmp/fn/index.ts;type=application/typescript")
          echo "deploy HTTP $code"
          cat /tmp/fn/out.json || true
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Деплой не удался (HTTP $code)."
            exit 1
          fi

      - name: Smoke test
        run: |
          sleep 8
          curl -s -m 30 "https://yapnxwamxmyobnffdhvu.supabase.co/functions/v1/api/api/health" | tee /tmp/health.txt
          grep -q '"status":"ok"' /tmp/health.txt
