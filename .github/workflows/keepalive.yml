name: Держим backend проснувшимся (keep-alive)

# Render free «засыпает» после ~15 минут простоя, и первый запрос после этого
# ждёт 30–60 секунд, пока контейнер запустится. Этот пинг раз в 10 минут
# держит сервис тёплым, чтобы сайт открывался быстро.
#
# Не нужен — просто удалите этот файл.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL не задан — пропускаю пинг."
            exit 0
          fi
          code=$(curl -s -o /dev/null --max-time 120 -w "%{http_code}" "$BACKEND_URL/api/health")
          echo "HTTP $code"
          test "$code" = "200"
