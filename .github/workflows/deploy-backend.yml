name: Deploy backend (Modal) — только вручную

# Автодеплой на Modal отключён: backend переехал на Render (см. render.yaml).
# Этот workflow оставлен на случай, если понадобится снова задеплоить на Modal —
# запускать вручную из вкладки Actions.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Deploy to Modal
        working-directory: backend
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_WORKSPACE: vsvolodin2014
        run: python -m modal deploy modal_app.py
