name: smoke2

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Models raw JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -m 60 -o /tmp/r.json \
            -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"ответь ровно одним словом: привет"}],"max_tokens":30}'
          echo "bytes: $(wc -c < /tmp/r.json)"
          echo "----- body -----"
          cat /tmp/r.json
          echo
          echo "----- python parse test -----"
          python3 -c "import json;d=json.load(open('/tmp/r.json'));print('choices:',d['choices'][0]['message']['content'])"
