name: Автопостинг (cron → Supabase Edge Function)

# Автопостинг выполняет Edge Function `api` на Supabase: она работает
# постоянно и не «засыпает». GitHub Actions лишь дёргает её по расписанию,
# поэтому раннеру не нужны ни Python, ни токены Telegram/LLM —
# достаточно секрета CRON_SECRET.
on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа по UTC
  workflow_dispatch:          # позволяет запустить вручную из вкладки Actions

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Запустить автопостинг через Supabase Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE: https://yapnxwamxmyobnffdhvu.supabase.co/functions/v1/api
        run: |
          set -e
          echo "--- health ---"
          curl -s --max-time 60 "$API_BASE/api/health"; echo
          echo "--- autopost ---"
          code=$(curl -s --max-time 900 -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$API_BASE/api/cron/autopost" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/resp.json; echo
          test "$code" = "200"
